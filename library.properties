sentence=Read and write a memory buffer through the Arduino Stream interface.
paragraph=ReadBufferStream serves a buffer through read(), peek() and available(), so Stream parsers work on memory. WriteBufferStream collects print() output in a fixed buffer, reports the bytes written and flags an overflow. No allocation and no copies.
