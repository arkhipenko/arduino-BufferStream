name: CI
on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [gnu++11, c++17, c++20]
    steps:
      - uses: actions/checkout@v7
      - run: make -C tests/host CXX=${{ matrix.compiler }} STD=${{ matrix.std }}
  examples:
    name: Examples (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AVR, Uno
            fqbn: arduino:avr:uno
            platform: avr
            core: ""
          - name: core 3.x, ESP32
            fqbn: esp32:esp32:esp32
            platform: esp32
            core: ""
          - name: core 3.x, ESP32-C3 (RISC-V)
            fqbn: esp32:esp32:esp32c3
            platform: esp32
            core: ""
          - name: core 2.0.17, ESP32
            fqbn: esp32:esp32:esp32
            platform: esp32
            core: "2.0.17"
    env:
      SKETCHES: |
        - examples/ReadString
        - examples/WriteString
        - examples/ParseBuffer
        - examples/WriteOverflow
    steps:
      - uses: actions/checkout@v7
      - name: AVR core
        if: matrix.platform == 'avr'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: arduino:avr
          sketch-paths: ${{ env.SKETCHES }}
          cli-compile-flags: |
            - --warnings
            - all
      - name: Latest ESP32 core
        if: matrix.platform == 'esp32' && matrix.core == ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: ${{ env.SKETCHES }}
          cli-compile-flags: |
            - --warnings
            - all
      - name: Pinned ESP32 core ${{ matrix.core }}
        if: matrix.platform == 'esp32' && matrix.core != ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: ${{ env.SKETCHES }}
          cli-compile-flags: |
            - --warnings
            - all
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          project-type: library
          library-manager: "false"
